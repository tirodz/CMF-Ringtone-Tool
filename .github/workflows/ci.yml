name: CI

# Build check for the Tauri app on every push/PR. Skips cleanly until the
# app source exists, so you're free to push backend code meanwhile.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TAURI_APP_DIR: app

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Tauri project (skip if absent)
        id: gate
        shell: pwsh
        run: |
          $conf = Join-Path $env:TAURI_APP_DIR "src-tauri/tauri.conf.json"
          if (Test-Path $conf) { "present=true" | Out-File $env:GITHUB_OUTPUT -Append }
          else { "present=false" | Out-File $env:GITHUB_OUTPUT -Append; Write-Output "No app source yet at $env:TAURI_APP_DIR - skipping build" }

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.present == 'true' && hashFiles(format('{0}/package.json', env.TAURI_APP_DIR)) != ''
        with:
          node-version: 20

      - name: Install frontend dependencies
        if: steps.gate.outputs.present == 'true' && hashFiles(format('{0}/package.json', env.TAURI_APP_DIR)) != ''
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: if (Test-Path package-lock.json) { npm ci } else { npm install }

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.present == 'true'
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        if: steps.gate.outputs.present == 'true'
        working-directory: ${{ env.TAURI_APP_DIR }}
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Upload test build
        if: steps.gate.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cmf-ringtone-tool-build
          path: ${{ env.TAURI_APP_DIR }}/src-tauri/target/release/*.exe
          if-no-files-found: warn

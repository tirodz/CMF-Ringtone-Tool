[package]
name = "cmf-ringtone-tool"
version = "1.0.0"
description = "Custom ringtone delivery for the CMF Watch Pro 2"
authors = ["tirodz"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "cmf_ringtone_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
